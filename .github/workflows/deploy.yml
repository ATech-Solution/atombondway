name: Build & Deploy (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Payload types
        run: npm run generate:types

      - name: Generate Payload import map
        run: npm run generate:importmap

      - name: Build Next.js
        run: mkdir -p data && npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: file:./data/payload.db
          NEXT_PUBLIC_SITE_URL_PROD: https://dev.atombondway.com
          NEXT_PUBLIC_DOMAIN_PROD: https://dev.atombondway.com
          PAYLOAD_PUBLIC_SERVER_URL_PROD: https://dev.atombondway.com

      - name: Patch ecosystem config for dev
        run: |
          sed \
            -e 's|/home/deploy/atombondway/|/home/deploy/dev/|g' \
            -e "s|name: 'company-profile'|name: 'company-profile-dev'|g" \
            -e "s|PORT: 3000|PORT: 3001|g" \
            -e "s|atombondway.com|dev.atombondway.com|g" \
            ecosystem.config.js > ecosystem.config.dev.js

      - name: Upload to server
        run: |
          # Ensure persistent directories exist
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'mkdir -p /home/deploy/dev/data /home/deploy/dev/public/media'

          # Sync source code (exclude built artifacts and persistent server-side data)
          rsync -az --delete \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='public/media/' \
            --exclude='data/' \
            --exclude='.git/' \
            --exclude='ecosystem.config.dev.js' \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/

          # Upload patched ecosystem config
          scp ecosystem.config.dev.js \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/ecosystem.config.js

          # Sync built Next.js output (built on runner, not server)
          echo "=== Syncing .next/ to server ==="
          rsync -az --delete .next/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/.next/

          # Sync node_modules (needed on server for migrate command)
          echo "=== Syncing node_modules to server ==="
          rsync -az --delete node_modules/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/node_modules/

          # Upload media files if server has none (one-time bootstrap)
          MEDIA_COUNT=$(ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'ls /home/deploy/dev/public/media/ 2>/dev/null | wc -l')
          if [ "$MEDIA_COUNT" = "0" ]; then
            echo "=== Server has no media — uploading initial media files ==="
            rsync -az public/media/ \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/public/media/
          else
            echo "Server has $MEDIA_COUNT media file(s) — skipping initial upload"
          fi

          # Upload local DB only if server DB is missing or empty
          if ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              'test -s /home/deploy/dev/data/payload.db' 2>/dev/null; then
            echo "Server DB exists — skipping DB upload"
          elif [ -f data/payload.db ]; then
            echo "Server DB missing — uploading local DB..."
            scp data/payload.db \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/data/payload.db
          else
            echo "No local DB — server DB must already exist or will be built by migrations"
          fi

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            source ~/.profile 2>/dev/null || true

            cd /home/deploy/dev

            echo "=== Syncing new media from production ==="
            # standalone server.js does chdir(__dirname), so media may be in either location
            if rsync -a /home/deploy/atombondway/.next/standalone/public/media/ public/media/ 2>/dev/null; then
              echo "Media synced from production (standalone path)"
            elif rsync -a /home/deploy/atombondway/public/media/ public/media/ 2>/dev/null; then
              echo "Media synced from production (regular path)"
            else
              echo "Media sync skipped (production media unavailable)"
            fi

            echo "=== Running migrations ==="
            export DATABASE_URL="file:/home/deploy/dev/data/payload.db"
            sqlite3 data/payload.db "DELETE FROM payload_migrations WHERE batch = -1;" 2>/dev/null || true
            npm run migrate || { echo "ERROR: npm run migrate failed"; exit 1; }

            echo "=== Verifying DB schema ==="
            DB_OK=true
            if command -v sqlite3 >/dev/null 2>&1 && [ -f data/payload.db ]; then
              echo "DB tables:"
              sqlite3 data/payload.db ".tables"
              echo "projects_locales check:"
              sqlite3 data/payload.db "SELECT COUNT(*) FROM projects_locales;" 2>/dev/null || { echo "MISSING: projects_locales — will rebuild DB"; DB_OK=false; }
              echo "payload_migrations applied:"
              sqlite3 data/payload.db "SELECT name FROM payload_migrations ORDER BY name;" 2>/dev/null || { echo "MISSING: payload_migrations table"; DB_OK=false; }
            else
              echo "sqlite3 not available — skipping schema verification"
            fi

            if [ "$DB_OK" = "false" ]; then
              echo "=== DB schema incomplete — rebuilding from migrations ==="
              rm -f data/payload.db data/payload.db-shm data/payload.db-wal
              npm run migrate
              echo "DB rebuilt. Tables:"
              sqlite3 data/payload.db ".tables" 2>/dev/null || echo "sqlite3 unavailable"
            fi

            echo "=== Restarting PM2 ==="
            pm2 delete company-profile-dev 2>/dev/null || true
            pm2 start ecosystem.config.js --env production
            pm2 save

            echo "=== Waiting for server startup ==="
            sleep 8

            echo "=== Health check ==="
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/projects 2>/dev/null || echo "000")
            echo "GET /api/projects → HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "WARNING: Server health check failed (expected 200, got $HTTP_STATUS)"
              echo "PM2 logs (last 30 lines):"
              pm2 logs company-profile-dev --lines 30 --nostream 2>/dev/null || echo "Could not get PM2 logs"
            fi

            echo "=== Deploy complete ==="
