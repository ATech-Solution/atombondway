name: Build & Deploy (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Patch ecosystem config for dev
        run: |
          sed \
            -e 's|/home/deploy/atombondway/|/home/deploy/dev/|g' \
            -e "s|name: 'company-profile'|name: 'company-profile-dev'|g" \
            -e "s|PORT: 3000|PORT: 3001|g" \
            -e "s|atombondway.com|dev.atombondway.com|g" \
            -e "s|EMAIL_FROM_NAME: 'Atombondway',|EMAIL_FROM_NAME: 'Atombondway',\n        PAYLOAD_DB_PUSH: 'true',|" \
            ecosystem.config.js > ecosystem.config.dev.js

      - name: Upload source to server
        run: |
          # Ensure persistent directories exist
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'mkdir -p /home/deploy/dev/data /home/deploy/dev/public/media'

          # Sync source code (exclude built artifacts and persistent server-side data)
          rsync -az --delete \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='public/media/' \
            --exclude='data/' \
            --exclude='.git/' \
            --exclude='ecosystem.config.dev.js' \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/

          # Upload patched ecosystem config
          scp ecosystem.config.dev.js \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/dev/ecosystem.config.js

      - name: Build & deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            source ~/.profile 2>/dev/null || true

            cd /home/deploy/dev

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Generating Payload types ==="
            npm run generate:types

            echo "=== Generating Payload import map ==="
            npm run generate:importmap

            echo "=== Building Next.js ==="
            export NODE_ENV=production
            export NEXT_PUBLIC_SITE_URL_PROD=https://dev.atombondway.com
            export NEXT_PUBLIC_DOMAIN_PROD=https://dev.atombondway.com
            export PAYLOAD_PUBLIC_SERVER_URL_PROD=https://dev.atombondway.com
            npm run build

            echo "=== Copying migration files from production ==="
            rsync -az /home/deploy/atombondway/src/migrations/ src/migrations/

            echo "=== Syncing DB from production ==="
            # Use sqlite3 online backup — safe even if prod is being written to
            rm -f data/payload.db data/payload.db-shm data/payload.db-wal
            sqlite3 /home/deploy/atombondway/data/payload.db ".backup data/payload.db"

            echo "=== Syncing media from production ==="
            rsync -a /home/deploy/atombondway/public/media/ public/media/

            echo "=== Running any pending migrations ==="
            export DATABASE_URL="file:/home/deploy/dev/data/payload.db"
            npm run migrate || echo "No pending migrations"

            echo "=== Restarting PM2 ==="
            pm2 delete company-profile-dev 2>/dev/null || true
            pm2 start ecosystem.config.js --env production
            pm2 save
            echo "=== Deploy complete ==="
